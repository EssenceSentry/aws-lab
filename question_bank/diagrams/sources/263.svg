<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530">
<title>Logical expiration happens before asynchronous deletion</title>
<desc>At creation the item is live. At day 120 application reads exclude it, while storage cleanup occurs later with no exact deletion deadline.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#52677a"/></marker></defs>
<rect width="1000" height="530" fill="#fbfaf7"/>
<g font-family="Arial,sans-serif" fill="#18364c">
<text x="35" y="42" font-size="28" font-weight="700">Two different events: expiry and deletion</text>
<path d="M75 135 H930" stroke="#52677a" stroke-width="3" marker-end="url(#arrow)"/>
<g font-size="23" text-anchor="middle"><text x="115" y="110">Creation</text><text x="510" y="110">Day 120</text><text x="830" y="92">Later cleanup</text><text x="830" y="119" font-size="18">Asynchronous, not exact</text></g>
<path d="M115 125 V155 M510 125 V415 M830 125 V415" stroke="#52677a" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="65" y="190" width="425" height="90" rx="6" fill="#e5f4f0" stroke="#168981"/>
<rect x="510" y="190" width="420" height="90" rx="6" fill="#fff3db" stroke="#b87a0b"/>
<g font-size="24" text-anchor="middle"><text x="278" y="225">Application may return item</text><text x="278" y="256">when otherwise authorized</text><text x="720" y="225">Application excludes item</text><text x="720" y="256">after its TTL timestamp</text></g>
<rect x="65" y="315" width="745" height="90" rx="6" fill="#e8f2f8" stroke="#147eae"/>
<rect x="830" y="315" width="100" height="90" rx="6" fill="#edf0f2" stroke="#71808b"/>
<g font-size="23" text-anchor="middle"><text x="438" y="350">Item can still exist in storage</text><text x="438" y="380">TTL service performs background deletion</text><text x="880" y="352" font-size="20">Item</text><text x="880" y="379" font-size="20">deleted</text></g>
<text x="35" y="467" font-size="22">Read visibility is enforced by the application. TTL cleans up storage.</text>
<text x="35" y="502" font-size="18" fill="#52677a">Schematic timeline: the cleanup interval is not a guaranteed duration.</text>
</g></svg>
