<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img" aria-labelledby="title desc">
<title id="title">Rollback that preserves version history</title><desc id="desc">Q114: Versions v1, v2 and v3 remain. Copy the body of v1 to the same key to create v4 as current, rather than deleting v2 and v3.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="black"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M0,10 L10,0" stroke="black" stroke-width="1"/></pattern></defs>
<rect width="920" height="370" fill="white"/>
<g font-family="Arial, sans-serif" fill="black" stroke="none">
<text x="30" y="38" font-size="24" font-weight="bold" text-anchor="start">Q114 · Rollback creates a new version; it does not erase history</text>
<text x="30" y="70" font-size="17" font-weight="normal" text-anchor="start">One S3 object key. Version IDs below are schematic labels.</text>
<rect x="40" y="142" width="180" height="80" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="130.0" y="172" font-size="19" font-weight="bold" text-anchor="middle">v1</text>
<text x="130.0" y="199" font-size="16" font-weight="normal" text-anchor="middle">Original body A</text>
<rect x="260" y="142" width="180" height="80" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="350.0" y="172" font-size="19" font-weight="bold" text-anchor="middle">v2</text>
<text x="350.0" y="199" font-size="16" font-weight="normal" text-anchor="middle">Body B</text>
<rect x="480" y="142" width="180" height="80" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="570.0" y="172" font-size="19" font-weight="bold" text-anchor="middle">v3</text>
<text x="570.0" y="199" font-size="16" font-weight="normal" text-anchor="middle">Body C</text>
<rect x="700" y="142" width="180" height="80" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="790.0" y="172" font-size="19" font-weight="bold" text-anchor="middle">v4</text>
<text x="790.0" y="199" font-size="16" font-weight="normal" text-anchor="middle">Body A again</text>
<line x1="220" y1="182" x2="255" y2="182" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="440" y1="182" x2="475" y2="182" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660" y1="182" x2="695" y2="182" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="570" y="255" font-size="17" font-weight="normal" text-anchor="middle">Was current</text>
<text x="790" y="255" font-size="18" font-weight="bold" text-anchor="middle">Now current</text>
<path d="M130,140 L130,105 L790,105 L790,136" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="100" font-size="16" font-weight="bold" text-anchor="middle">Copy selected old body into a new version</text>
<text x="30" y="305" font-size="17" font-weight="normal" text-anchor="start">Keep v1, v2 and v3 retrievable; protect required history from deletion and lifecycle expiry.</text>
<text x="30" y="340" font-size="16" font-weight="normal" text-anchor="start">Horizontal arrows: version creation order. Top arrow: copy operation.</text>
</g></svg>
