<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">Independent consumers of a retained stream</title><desc id="desc">Q145: An append-only retained stream has records 1 through 8. Consumer A has checkpoint 6; consumer B has checkpoint 3. Either can replay retained earlier records. A successful read does not delete the stream record.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="black"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M0,10 L10,0" stroke="black" stroke-width="1"/></pattern></defs>
<rect width="920" height="360" fill="white"/>
<g font-family="Arial, sans-serif" fill="black" stroke="none">
<text x="30" y="38" font-size="24" font-weight="bold" text-anchor="start">Q145 · Consumption progress belongs to each application</text>
<text x="30" y="70" font-size="17" font-weight="normal" text-anchor="start">A retained log keeps records after successful processing; checkpoints are independent.</text>
<rect x="90" y="112" width="75" height="56" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="127.5" y="142" font-size="19" font-weight="bold" text-anchor="middle">R1</text>
<rect x="185" y="112" width="75" height="56" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="222.5" y="142" font-size="19" font-weight="bold" text-anchor="middle">R2</text>
<rect x="280" y="112" width="75" height="56" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="317.5" y="142" font-size="19" font-weight="bold" text-anchor="middle">R3</text>
<rect x="375" y="112" width="75" height="56" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="412.5" y="142" font-size="19" font-weight="bold" text-anchor="middle">R4</text>
<rect x="470" y="112" width="75" height="56" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="507.5" y="142" font-size="19" font-weight="bold" text-anchor="middle">R5</text>
<rect x="565" y="112" width="75" height="56" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="602.5" y="142" font-size="19" font-weight="bold" text-anchor="middle">R6</text>
<rect x="660" y="112" width="75" height="56" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="697.5" y="142" font-size="19" font-weight="bold" text-anchor="middle">R7</text>
<rect x="755" y="112" width="75" height="56" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="792.5" y="142" font-size="19" font-weight="bold" text-anchor="middle">R8</text>
<text x="40" y="144" font-size="16" font-weight="bold" text-anchor="start">Log</text>
<line x1="90" y1="91" x2="830" y2="91" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="87" font-size="15" font-weight="normal" text-anchor="middle">record order</text>
<line x1="602" y1="169" x2="602" y2="210" stroke="black" stroke-width="2" stroke-dasharray="6 5"/>
<text x="602" y="236" font-size="18" font-weight="bold" text-anchor="middle">A: checkpoint R6</text>
<line x1="317" y1="169" x2="317" y2="252" stroke="black" stroke-width="2" stroke-dasharray="6 5"/>
<text x="317" y="278" font-size="18" font-weight="bold" text-anchor="middle">B: checkpoint R3</text>
<text x="30" y="322" font-size="17" font-weight="normal" text-anchor="start">Replay is limited by retention. Repeated processing and sink writes still need deduplication.</text>
</g></svg>
