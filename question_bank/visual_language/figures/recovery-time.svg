<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">Recovery point and recovery time are different</title><desc id="desc">Illustrative timeline: last recoverable commit at 11:55, failure at 12:00, validated service restored at 12:20. Recovery-point gap is five minutes; recovery time is twenty minutes. These are example observations, not guarantees.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="black"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M0,10 L10,0" stroke="black" stroke-width="1"/></pattern></defs>
<rect width="920" height="360" fill="white"/>
<g font-family="Arial, sans-serif" fill="black" stroke="none">
<text x="35" y="38" font-size="25" font-weight="bold" text-anchor="start">Recovery point and recovery time: two different gaps</text>
<text x="35" y="69" font-size="17" font-weight="normal" text-anchor="start">Illustrative observations, not service promises or scenario targets</text>
<line x1="80" y1="160" x2="865" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="180" y1="147" x2="180" y2="173" stroke="black" stroke-width="2"/>
<text x="180" y="130" font-size="18" font-weight="bold" text-anchor="middle">11:55</text>
<line x1="310" y1="147" x2="310" y2="173" stroke="black" stroke-width="2"/>
<text x="310" y="130" font-size="18" font-weight="bold" text-anchor="middle">12:00</text>
<line x1="830" y1="147" x2="830" y2="173" stroke="black" stroke-width="2"/>
<text x="830" y="130" font-size="18" font-weight="bold" text-anchor="middle">12:20</text>
<text x="180" y="200" font-size="16" font-weight="normal" text-anchor="middle">Last recoverable</text>
<text x="180" y="220" font-size="16" font-weight="normal" text-anchor="middle">commit</text>
<text x="310" y="200" font-size="16" font-weight="normal" text-anchor="middle">Failure</text>
<text x="830" y="200" font-size="16" font-weight="normal" text-anchor="middle">Service validated</text>
<text x="830" y="220" font-size="16" font-weight="normal" text-anchor="middle">and restored</text>
<line x1="180" y1="260" x2="310" y2="260" stroke="black" stroke-width="2"/>
<line x1="180" y1="251" x2="180" y2="269" stroke="black" stroke-width="2"/>
<line x1="310" y1="251" x2="310" y2="269" stroke="black" stroke-width="2"/>
<text x="245" y="292" font-size="17" font-weight="bold" text-anchor="middle">5 min data gap</text>
<line x1="310" y1="260" x2="830" y2="260" stroke="black" stroke-width="2"/>
<line x1="830" y1="251" x2="830" y2="269" stroke="black" stroke-width="2"/>
<text x="570" y="292" font-size="17" font-weight="bold" text-anchor="middle">20 min recovery time</text>
<text x="35" y="333" font-size="17" font-weight="normal" text-anchor="start">Compare the data gap with the RPO target; compare recovery time with the RTO target.</text>
</g></svg>
