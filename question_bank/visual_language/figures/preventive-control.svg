<svg xmlns="http://www.w3.org/2000/svg" width="920" height="415" viewBox="0 0 920 415" role="img" aria-labelledby="title desc">
<title id="title">Prevention and remediation occur at different points</title><desc id="desc">Q379: A supported CloudFormation deployment with missing required tags is blocked by an enabled FAIL-mode stack hook. Config evaluates an already-created resource. Separate controls prevent direct-API bypass.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="black"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M0,10 L10,0" stroke="black" stroke-width="1"/></pattern></defs>
<rect width="920" height="415" fill="white"/>
<g font-family="Arial, sans-serif" fill="black" stroke="none">
<text x="30" y="38" font-size="24" font-weight="bold" text-anchor="start">Q379 · Place the control before the forbidden state</text>
<text x="30" y="70" font-size="16" font-weight="normal" text-anchor="start">Assumptions: supported types; hook active in this account/Region; bypass controls enforced.</text>
<text x="30" y="110" font-size="16" font-weight="bold" text-anchor="start">PREVENTIVE PATH</text>
<rect x="30" y="130" width="235" height="80" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="147.5" y="160" font-size="19" font-weight="bold" text-anchor="middle">Template submitted</text>
<text x="147.5" y="187" font-size="16" font-weight="normal" text-anchor="middle">Required Project tag absent</text>
<rect x="340" y="130" width="240" height="80" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="460.0" y="160" font-size="19" font-weight="bold" text-anchor="middle">STACK hook · FAIL</text>
<text x="460.0" y="187" font-size="16" font-weight="normal" text-anchor="middle">Required-key validation</text>
<rect x="655" y="130" width="235" height="80" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="772.5" y="160" font-size="19" font-weight="bold" text-anchor="middle">Deployment blocked</text>
<text x="772.5" y="187" font-size="16" font-weight="normal" text-anchor="middle">No violating resource</text>
<line x1="270" y1="170" x2="335" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="585" y1="170" x2="650" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="260" font-size="16" font-weight="bold" text-anchor="start">DETECTIVE / REMEDIAL PATH</text>
<rect x="30" y="280" width="235" height="80" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="147.5" y="310" font-size="19" font-weight="bold" text-anchor="middle">Resource created</text>
<text x="147.5" y="337" font-size="16" font-weight="normal" text-anchor="middle">Missing required tag</text>
<rect x="340" y="280" width="240" height="80" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="460.0" y="310" font-size="19" font-weight="bold" text-anchor="middle">Config evaluates</text>
<text x="460.0" y="337" font-size="16" font-weight="normal" text-anchor="middle">Noncompliance found</text>
<rect x="655" y="280" width="235" height="80" rx="5" stroke="black" stroke-width="2" fill="white"/>
<text x="772.5" y="310" font-size="19" font-weight="bold" text-anchor="middle">Remediation runs</text>
<text x="772.5" y="337" font-size="16" font-weight="normal" text-anchor="middle">Exposure already occurred</text>
<line x1="270" y1="320" x2="335" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="585" y1="320" x2="650" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="395" font-size="16" font-weight="normal" text-anchor="start">WARN reports but permits deployment. Tag values, tag presence and propagation are separate tests.</text>
</g></svg>
