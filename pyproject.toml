[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-lab"
version = "0.1.0"
description = "A deterministic AWS multi-account architecture study sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "graphviz>=0.20,<1",
    "streamlit>=1.42,<2",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["app.py", "src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
